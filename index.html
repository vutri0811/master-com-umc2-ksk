            { cat: 'script', title: 'B2: Hướng dẫn CLS', desc: '"Dạ, mời Anh/Chị qua phòng số 5 lấy mẫu, sau đó di chuyển đến khu vực Chẩn đoán hình ảnh cuối hành lang. Vui lòng giữ phiếu để nhân viên hỗ trợ nhanh nhất."' },

            { cat: 'situations', title: '1. Chờ đợi lâu', desc: '"Dạ, em rất xin lỗi Anh/Chị. Do hôm nay khách siêu âm hơi đông, em đã báo ưu tiên cho mình ngay khi có phòng trống. Mời Anh/Chị dùng nước và đợi em ít phút."' },

            { cat: 'situations', title: '10. Thực hiện thêm khi đã muộn', desc: '"Dạ em sẵn lòng hỗ trợ. Tuy nhiên vì kỹ thuật này cần chuẩn bị và máy móc cần bảo trì định kỳ, nếu thực hiện ngay có thể không tối ưu. Em xin đặt lịch ưu tiên cho mình sáng mai nhé?"' },

            { cat: 'situations', title: '15. Lỡ uống nước/ăn', desc: '"Dạ vì mình lỡ dùng đồ ăn/uống nên kết quả có thể không chính xác. Để đảm bảo quyền lợi, mình vui lòng đợi thêm 2 tiếng hoặc quay lại vào sáng mai để thực hiện riêng mục này nhé."' },

            { cat: 'situations', title: '17. Hỏi kết quả qua điện thoại', desc: '"Dạ để bảo mật thông tin y tế, em xin phép không báo kết quả chi tiết qua điện thoại ạ. Anh/Chị có thể tra cứu trên App hoặc em hỗ trợ gửi bản cứng về tận nhà cho mình."' },

            grid.innerHTML = '';
            
            const filtered = data.filter(item => {
                const matchesCat = filter === 'all' || item.cat === filter;
                const matchesKey = item.title.toLowerCase().includes(keyword.toLowerCase()) || 
                                 item.desc.toLowerCase().includes(keyword.toLowerCase());
                return matchesCat && matchesKey;
            });

            if (filtered.length === 0) {
                noResults.classList.remove('hidden');
            } else {
                noResults.classList.add('hidden');
                filtered.forEach(item => {
                    const card = document.createElement('div');
                    card.className = 'category-card bg-white p-5 rounded-xl shadow-sm border-l-4 medical-border hover:shadow-md transition-all flex flex-col justify-between';
                    
                    let displayTitle = item.title;
                    let displayDesc = item.desc;
                    
                    if (keyword) {
                        const regex = new RegExp(`(${keyword})`, 'gi');
                        displayTitle = item.title.replace(regex, '<span class="search-highlight">$1</span>');
                        displayDesc = item.desc.replace(regex, '<span class="search-highlight">$1</span>');
                    }

                    card.innerHTML = `
                        <div>
                            <div class="flex items-start justify-between mb-2">
                                <span class="text-[10px] font-bold uppercase text-gray-400 tracking-widest">${getCategoryName(item.cat)}</span>
                                <i class="fas ${getCategoryIcon(item.cat)} text-blue-200"></i>
                            </div>
                            <h3 class="font-bold text-gray-800 text-base mb-2">${displayTitle}</h3>
                            <p class="text-gray-600 text-sm leading-relaxed italic border-t border-dashed pt-2 mt-2">${displayDesc}</p>
                        </div>
                        <div class="mt-4 flex justify-end">
                            <button onclick="copyText('${item.desc.replace(/'/g, "\\'")}')" class="text-[11px] font-semibold text-blue-600 hover:text-blue-800 bg-blue-50 px-3 py-1 rounded-md transition-colors">
                                <i class="far fa-copy mr-1"></i> SAO CHÉP
                            </button>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            }
        }

        function getCategoryName(cat) {
            const names = { appearance: 'Tác phong', greeting: 'Mẫu câu', rules: 'Quy tắc', script: 'Kịch bản', situations: 'Tình huống' };
            return names[cat] || '';
        }

        function getCategoryIcon(cat) {
            const icons = { appearance: 'fa-user-check', greeting: 'fa-comments', rules: 'fa-gavel', script: 'fa-list-ol', situations: 'fa-exclamation-circle' };
            return icons[cat] || 'fa-info-circle';
        }

        function filterCategory(cat) {
            currentFilter = cat;
            const tabs = document.querySelectorAll('.category-tab');
            tabs.forEach(tab => {
                tab.classList.remove('bg-blue-100', 'text-blue-700', 'active-tab');
                tab.classList.add('bg-white', 'text-gray-600');
            });
            event.target.classList.add('bg-blue-100', 'text-blue-700', 'active-tab');
            renderContent(cat, document.getElementById('searchInput').value);
        }

        function copyText(text) {
            const el = document.createElement('textarea');
            el.value = text;
            document.body.appendChild(el);
            el.select();
            document.execCommand('copy');
            document.body.removeChild(el);
            
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-24 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-6 py-3 rounded-full text-sm z-50 shadow-xl font-medium';
            toast.innerHTML = '<i class="fas fa-check-circle mr-2 text-green-400"></i> Đã sao chép kịch bản!';
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 2000);
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            renderContent(currentFilter, e.target.value);
        });

        window.onload = () => renderContent();
    </script>
</body>
</html>
